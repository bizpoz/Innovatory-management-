// ── BULK UPLOAD MODAL ──
function BulkUploadModal({whId,onDone,onClose}){
  const [step,setStep]=useState('upload');
  const [rows,setRows]=useState([]);
  const [errors,setErrors]=useState([]);
  const whs=whSvc.getAll();
  const [selWh,setSelWh]=useState(whId||whs[0]?.id||'');
  const UNITS=['NOS','KG','MTR','LTR','SET','BOX','PAIR','ROLL','PKT','BTL','DRM','SHT'];
  const COLS='Name*,Code(auto if blank),Category*(MECH/ELEC/INST/SAFE/GEN),Sub-Category(code or blank),Unit*,Cost Price*,Min Stock,Opening Qty,Is Asset(YES/NO),Asset Code,Description,Rack Code';

  const downloadTemplate=()=>{
    const cats=catSvc.getAll();
    const subCatRef=cats.filter(c=>c.parentId).map(c=>c.id).join('/');
    const commentLine='# Sub-Category codes available: '+(subCatRef||'none yet — add in Category Master');
    const sample=[
      'Bearing 6205,,MECH,BEAR,NOS,120,5,10,NO,,Deep groove ball bearing,R-01-01',
      'Safety Helmet,,SAFE,,NOS,220,10,25,NO,,ISI marked hard hat,R-04-01',
      'Control Panel,,ELEC,,NOS,15000,1,2,YES,ASSET-2024-001,Main control panel,R-02-01',
    ];
    const blob=new Blob([[commentLine,COLS,...sample].join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bulk-upload-template.csv';a.click();
  };

  const parseCSV=(text)=>{
    const rawLines=text.trim().split('\n').map(l=>l.replace(/\r$/,''));
    const parsed=[];const errs=[];
    const allRacks=rackSvc.getAll(selWh);
    const allCats=catSvc.getAll();

    // ── Auto-detect header row (skip comment lines and find the header) ──
    const dataLines=rawLines.filter(l=>l.trim()&&!l.trim().startsWith('#'));
    if(dataLines.length<2){return {parsed:[],errs:['CSV is empty or has no data rows']};}

    // Detect header and figure out column positions dynamically
    const hdr=dataLines[0].split(',').map(s=>s.trim().toLowerCase().replace(/[^a-z0-9]/g,''));
    const colIdx=(keywords)=>{
      for(const kw of keywords){
        const i=hdr.findIndex(h=>h.includes(kw));
        if(i>=0)return i;
      }
      return -1;
    };

    // Map columns by keywords - works for any column order
    const iName     = colIdx(['name']);
    const iCode     = colIdx(['code','itemcode']);
    const iCat      = colIdx(['category','cat']);
    const iSub      = colIdx(['sub','subcategory','subcategories']);
    const iUnit     = colIdx(['unit','uom']);
    const iPrice    = colIdx(['price','cost','rate']);
    const iMinStock = colIdx(['min','minimum']);
    const iQty      = colIdx(['opening','qty','quantity','stock']);
    const iAsset    = colIdx(['asset']);
    const iAssetCode= colIdx(['assetcode','assetno']);
    const iDesc     = colIdx(['desc','description','remark']);
    const iRack     = colIdx(['rack','location','bin']);

    if(iName<0){return {parsed:[],errs:['Could not find a "Name" column in the CSV header']};}
    if(iPrice<0){return {parsed:[],errs:['Could not find a "Price/Cost" column in the CSV header']};}

    // Helper: resolve category by id OR name → return catId
    const resolveOrCreateCat=(rawVal,parentCatId)=>{
      if(!rawVal)return null;
      const v=rawVal.trim();
      // Try exact ID match first
      let cat=allCats.find(c=>c.id===v.toUpperCase());
      if(cat)return cat.id;
      // Try name match (case-insensitive)
      cat=allCats.find(c=>c.name.toLowerCase()===v.toLowerCase()&&(parentCatId?c.parentId===parentCatId:!c.parentId));
      if(cat)return cat.id;
      // Try partial match
      cat=allCats.find(c=>c.name.toLowerCase().includes(v.toLowerCase())&&(parentCatId?c.parentId===parentCatId:!c.parentId));
      if(cat)return cat.id;
      return null; // not found
    };

    // Collect unknown categories for auto-create hint
    const unknownCats=new Set();
    const unknownSubs={};

    dataLines.slice(1).forEach((line,i)=>{
      if(!line.trim())return;
      const cols=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      const g=(idx)=>idx>=0&&idx<cols.length?cols[idx]:'';
      const rowNum=i+2;

      const name=g(iName);
      if(!name){errs.push('Row '+rowNum+': Name is required');return;}

      // Price
      const rawPrice=g(iPrice);
      if(!rawPrice||isNaN(rawPrice)){errs.push('Row '+rowNum+' "'+name+'": Cost Price must be a number (got "'+rawPrice+'")');return;}

      // Category - resolve by name or code
      const rawCat=g(iCat)||'GEN';
      const catId=resolveOrCreateCat(rawCat,null);
      if(!catId){
        unknownCats.add(rawCat);
        errs.push('Row '+rowNum+' "'+name+'": Unknown category "'+rawCat+'" — will be shown in preview as GEN');
      }

      // Sub-category - resolve by name or code under the found parent
      const rawSub=g(iSub);
      let subCatId='';
      if(rawSub&&catId){
        subCatId=resolveOrCreateCat(rawSub,catId)||'';
        if(!subCatId){
          if(!unknownSubs[rawCat])unknownSubs[rawCat]=new Set();
          unknownSubs[rawCat].add(rawSub);
          // Don't error — just leave blank, user can fix in preview
        }
      }

      const unit=g(iUnit)||'NOS';
      const minStock=Number(g(iMinStock))||0;
      const openingQty=Number(g(iQty))||0;
      const isAssetBool=(g(iAsset)||'').toUpperCase()==='YES';
      // Auto-generate asset code if asset but no code provided
      const rawAssetCode=g(iAssetCode)||'';
      const assetCode=rawAssetCode||(isAssetBool?'ASSET-'+Date.now().toString(36).toUpperCase().slice(-6):'');
      const desc=g(iDesc)||'';
      const rackCode=g(iRack)||'';
      const rack=allRacks.find(r=>r.code===rackCode)||null;
      const code=g(iCode)||'';

      parsed.push({
        name,
        category:catId||'GEN',
        subCategory:subCatId||'',
        unit,
        costPrice:Number(rawPrice)||0,
        minStock,openingQty,
        isAsset:isAssetBool,assetCode,
        description:desc,rackId:rack?.id||'',
        whId:selWh,
        code:code||'',
        status:'Active',
        _rawCat:rawCat,
        _rawSub:rawSub||'',
      });
    });

    // Add summary warnings for unknown cats/subs (not errors - user can fix in preview)
    if(unknownCats.size>0){
      errs.unshift('⚠️ Unknown categories (set to GEN — fix in preview): '+[...unknownCats].join(', '));
    }
    Object.entries(unknownSubs).forEach(([cat,subs])=>{
      errs.push('⚠️ Sub-categories not found under "'+cat+'" (cleared — fix in preview): '+[...subs].join(', '));
    });

    return {parsed,errs};
  };

  const handleFile=(ev)=>{
    const file=ev.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(e)=>{
      const {parsed,errs}=parseCSV(e.target.result);
      setRows(parsed);setErrors(errs);
      // Always go to preview so user can edit rows inline even if there are errors
      setStep(parsed.length>0?'preview':'errors');
    };
    reader.readAsText(file);
  };

  const [importing,setImporting]=useState(false);
  const [importProgress,setImportProgress]=useState(0);

  const importAll=async()=>{
    setImporting(true);setImportProgress(0);
    let count=0;
    for(let i=0;i<rows.length;i++){
      const row=rows[i];
      try{
        // Check if item with same code already exists in this warehouse
        const existing=itemSvc.getAll(row.whId).find(it=>it.code===row.code);
        if(existing){
          // Item exists — just update its stock
          await stockSvc.setQty(existing.id,existing.whId,Number(row.openingQty||0));
        } else {
          // Auto-generate asset code at import time if still missing
          const importRow={...row,costPrice:Number(row.costPrice||0),minStock:Number(row.minStock||0),openingQty:Number(row.openingQty||0)};
          if(importRow.isAsset&&!importRow.assetCode)importRow.assetCode='ASSET-'+String(i+1).padStart(4,'0');
          // New item — create in all warehouses
          await itemSvc.create(importRow);
        }
        count++;
        setImportProgress(Math.round((i+1)/rows.length*100));
      }catch(e){
        console.warn('Row skip:',e.message);
      }
    }
    setImporting(false);
    onDone(count);
  };

  return React.createElement(Modal,{title:'Bulk Upload Items',onClose,size:'lg'},
    step==='upload'&&React.createElement('div',null,
      React.createElement('div',{className:'alert alert-blue',style:{marginBottom:12}},
        React.createElement(Ic,{n:'info',s:13}),' Download template, fill items, then upload. ',React.createElement('strong',null,'Opening Qty sets initial stock immediately.')
      ),
      React.createElement('div',{className:'fg',style:{marginBottom:12}},
        React.createElement('label',{className:'flbl'},'Import to Warehouse'),
        React.createElement('select',{className:'fi',value:selWh,onChange:e=>setSelWh(e.target.value)},whs.map(w=>React.createElement('option',{key:w.id,value:w.id},w.name)))
      ),
      React.createElement('div',{style:{display:'flex',gap:10,marginBottom:16}},
        React.createElement('button',{className:'btn btn-outline',onClick:downloadTemplate},'Download Template CSV'),
        React.createElement('label',{className:'btn btn-primary',style:{cursor:'pointer'}},
          'Upload Filled CSV',
          React.createElement('input',{type:'file',accept:'.csv',style:{display:'none'},onChange:handleFile})
        )
      ),
      React.createElement('div',{style:{background:'var(--off2)',borderRadius:'var(--r)',padding:'12px 14px',fontSize:11}},
        React.createElement('div',{style:{fontWeight:700,marginBottom:4}},'CSV Columns:'),
        React.createElement('code',null,COLS)
      )
    ),

    (step==='preview'||step==='errors')&&React.createElement('div',null,
      step==='errors'&&React.createElement('div',{className:'alert alert-amber',style:{marginBottom:10}},
        React.createElement(Ic,{n:'alert',s:13}),' ',String(errors.length),' error(s) found — fix below and click Import, or go back.'
      ),
      step==='preview'&&React.createElement('div',{className:'alert alert-green',style:{marginBottom:10}},
        React.createElement(Ic,{n:'check',s:13}),' ',String(rows.length),' items ready. You can edit any cell before importing.'
      ),
      // Errors list
      errors.length>0&&React.createElement('div',{style:{marginBottom:10,maxHeight:80,overflowY:'auto'}},
        errors.map((e,i)=>React.createElement('div',{key:i,style:{fontSize:11,color:'var(--red)',padding:'2px 0'}},e))
      ),
      // Editable table
      React.createElement('div',{className:'tw',style:{maxHeight:340,overflowY:'auto',marginBottom:12}},
        React.createElement('table',null,
          React.createElement('thead',null,React.createElement('tr',null,
            ['#','Code','Name*','Category*','Sub-Cat','Unit','Price*','Opening Qty','Asset',''].map(h=>React.createElement('th',{key:h,style:{fontSize:10}},h))
          )),
          React.createElement('tbody',null,
            rows.map((row,i)=>{
              const allCats=catSvc.getAll();
              const rootCats=allCats.filter(c=>!c.parentId);
              const subCats=allCats.filter(c=>c.parentId===row.category);
              const updateRow=(field,val)=>setRows(prev=>prev.map((r,idx)=>idx===i?{...r,[field]:val}:r));
              const deleteRow=()=>setRows(prev=>prev.filter((_,idx)=>idx!==i));
              return React.createElement('tr',{key:i,style:{verticalAlign:'middle'}},
                React.createElement('td',{style:{color:'var(--txt3)',fontSize:11}},String(i+1)),
                // Code
                React.createElement('td',null,React.createElement('input',{
                  style:{width:80,fontFamily:'var(--mono)',fontSize:10,padding:'3px 5px',border:'1px solid var(--border2)',borderRadius:4},
                  value:row.code||'',
                  onChange:e=>updateRow('code',e.target.value.toUpperCase()),

                React.createElement('td',null,React.createElement('input',{

                React.createElement('td',null,React.createElement('select',{

                    background:row._rawCat&&!allCats.find(c=>c.name.toLowerCase()===row._rawCat.toLowerCase()&&!c.parentId)?'#fff7ed':''},
                  value:row.category||'',
                  onChange:e=>updateRow('category',e.target.value)
                },
                  React.createElement('option',{value:''},'— Select —'),
                  rootCats.map(c=>React.createElement('option',{key:c.id,value:c.id},c.icon+' '+c.name))
                )),
                // Sub-category
                React.createElement('td',null,React.createElement('select',{

                },
                  React.createElement('option',{value:''},'—'+(row._rawSub&&!row.subCategory?' (was: '+row._rawSub+')':'')),

// ── Change Password Modal ──
function ChangePasswordModal({user,onClose,onSaved}){
  const {toast}=useCtx();
  const [oldPwd,setOldPwd]=useState('');
  const [newPwd,setNewPwd]=useState('');
  const [confirm,setConfirm]=useState('');
  const [err,setErr]=useState('');
  const [saving,setSaving]=useState(false);

  const save=async()=>{
    setErr('');
    if(!oldPwd){setErr('Enter your current password');return;}
    if(oldPwd!==user.password){setErr('Current password is incorrect');return;}
    if(!newPwd||newPwd.length<6){setErr('New password must be at least 6 characters');return;}
    if(newPwd!==confirm){setErr('Passwords do not match');return;}
    setSaving(true);
    try{
      await userSvc.update(user.id,{...user,password:newPwd});
      // Update session
      const sess={...user,password:newPwd};
      db.s('session',sess);
      onSaved();
    }catch(e){
      setErr(e.message||'Failed to change password');
    }finally{setSaving(false);}
  };

  return React.createElement(Modal,{title:'🔐 Change Password',onClose,size:'sm'},
    React.createElement('div',{className:'alert alert-blue',style:{marginBottom:14}},
      React.createElement(Ic,{n:'info',s:13}),' Changing password for: ',React.createElement('strong',null,user.name),' (',user.username,')'
    ),
    React.createElement('div',{className:'fg',style:{marginBottom:10}},
      React.createElement('label',{className:'flbl'},'Current Password'),
      React.createElement('input',{className:'fi',type:'password',value:oldPwd,onChange:e=>setOldPwd(e.target.value),placeholder:'Enter current password',autoFocus:true})
    ),
    React.createElement('div',{className:'fg',style:{marginBottom:10}},
      React.createElement('label',{className:'flbl'},'New Password'),
      React.createElement('input',{className:'fi',type:'password',value:newPwd,onChange:e=>setNewPwd(e.target.value),placeholder:'Minimum 6 characters'})
    ),
    React.createElement('div',{className:'fg',style:{marginBottom:12}},
      React.createElement('label',{className:'flbl'},'Confirm New Password'),
      React.createElement('input',{className:'fi',type:'password',value:confirm,onChange:e=>setConfirm(e.target.value),placeholder:'Re-enter new password',
        onKeyDown:e=>e.key==='Enter'&&save()})
    ),
    err&&React.createElement('div',{className:'alert alert-red',style:{marginBottom:10}},
      React.createElement(Ic,{n:'alert',s:13}),' ',err
    ),
    null,
    React.createElement('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
      React.createElement('button',{className:'btn btn-outline',onClick:onClose,disabled:saving},'Cancel'),
      React.createElement('button',{className:'btn btn-primary',onClick:save,disabled:saving},
        saving?'Saving...':'Change Password'
      )
    )
  );
}
